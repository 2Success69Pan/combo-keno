name: COMBO KENO · official archive backfill and live
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/combo-backfill-v1.mjs
      - .github/workflows/combo-live-update.yml
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: combo-official-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose official archive access (read-only)
        run: |
          for host in www.stoloto.ru m.stoloto.ru tli.stoloto.ru; do
            for path in "keno2/archive/" "p/api/mobile/api/v35/service/draws/archive?count=10&game=keno2"; do
              url="https://${host}/${path}"
              echo "Checking ${url}"
              curl -sSL --max-time 12 -o /dev/null -w "RESULT %{http_code}, bytes %{size_download}, IP %{remote_ip}\n" "$url" || true
            done
          done
      - name: Validate and catch up official KENO results
        run: node scripts/combo-backfill-v1.mjs
      - name: Commit verified draw archive only
        run: |
          if git diff --quiet -- combo-history-v1.json combo-history-tail-restored-v1.json combo-status-v1.json; then
            echo "No verified new draw"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add combo-history-v1.json combo-history-tail-restored-v1.json combo-status-v1.json
          git commit -m "COMBO: verified official draw archive sync"
          git pull --rebase origin main
          git push origin HEAD:main